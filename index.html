<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Traffic Navigation</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    🚦 Smart Traffic Navigation System
</header>

<div class="container">

    <!-- INPUT PANEL -->
    <div class="card input-card">
        <h2>Graph Input</h2>

        <input id="vertices" type="number" placeholder="Vertices">
        <input id="edges" type="number" placeholder="Edges">

        <textarea id="graphInput" placeholder="0 1 2
1 2 4
2 3 3"></textarea>

        <input id="source" type="number" placeholder="Source">
        <input id="destination" type="number" placeholder="Destination">

        <button onclick="run()">🚀 Find Optimal Route</button>
    </div>

    <!-- OUTPUT -->
    <div class="grid">

        <div class="card">
            <h3>🚦 Traffic Map</h3>
            <div id="traffic"></div>
        </div>

        <div class="card">
            <h3>🟢 Dijkstra Result</h3>
            <div id="dijkstra"></div>
        </div>

        <div class="card">
            <h3>🔵 A* Result</h3>
            <div id="astar"></div>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
